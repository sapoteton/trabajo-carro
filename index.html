<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Calculadora de Vuelto</title>

  <!-- Manifest de la aplicación -->
  <link rel="manifest" href="manifest.json">

  <!-- Color de la aplicación -->
  <meta name="theme-color" content="#198754">

  <!-- Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      font-family: Arial, sans-serif;

      background-color: #f2f2f2;

      display: flex;

      justify-content: center;

      padding: 40px 15px;

      margin: 0;

    }


    #box {

      background-color: white;

      width: 400px;

      max-width: 100%;

      padding: 25px;

      border-radius: 12px;

      box-shadow:
        0 0 10px rgba(0,0,0,0.2);

    }


    h2 {

      text-align: center;

      color: #333;

      margin-top: 0;

    }


    input {

      width: 100%;

      padding: 14px;

      margin-bottom: 15px;

      font-size: 20px;

      border: 1px solid #ccc;

      border-radius: 6px;

    }


    button {

      padding: 12px 18px;

      font-size: 16px;

      border: none;

      border-radius: 6px;

      cursor: pointer;

      margin-right: 5px;

    }


    #calcular {

      background-color: #198754;

      color: white;

    }


    #limpiar {

      background-color: #dc3545;

      color: white;

    }


    table {

      width: 100%;

      border-collapse: collapse;

      margin-top: 20px;

    }


    th {

      background-color: #198754;

      color: white;

      padding: 10px;

    }


    td {

      padding: 10px;

      text-align: center;

      border-bottom: 1px solid #ddd;

    }


    tr:nth-child(even) {

      background-color: #f5f5f5;

    }


    .billete-real {

      font-weight: bold;

    }


    .error {

      color: red;

      margin-top: 15px;

      text-align: center;

      font-weight: bold;

    }


    .vuelto {

      color: #198754;

      font-weight: bold;

    }


    .no-alcanza {

      color: #dc3545;

      font-weight: bold;

    }

  </style>

</head>


<body>


  <div id="box">

    <h2>Calculadora de Vuelto</h2>


    <input

      type="text"

      id="gastado"

      placeholder="Total gastado"

      inputmode="numeric"

      autocomplete="off"

    >


    <button
      id="calcular"
      onclick="calcularVuelto()">

      Calcular

    </button>


    <button
      id="limpiar"
      onclick="limpiar()">

      Limpiar

    </button>


    <div id="resultado"></div>

    <div id="error"></div>

  </div>



  <script>


    // ==========================================
    // FORMATO DE MILES
    // ==========================================

    document
      .getElementById("gastado")
      .addEventListener("input", function() {

        let valor =
          this.value.replace(/\D/g, "");


        if (valor === "") {

          this.value = "";

          return;

        }


        this.value =
          Number(valor).toLocaleString("es-CO");

      });



    // ==========================================
    // CALCULADORA
    // ==========================================

    function calcularVuelto() {


      let campo =
        document.getElementById("gastado");


      let resultado =
        document.getElementById("resultado");


      let error =
        document.getElementById("error");


      resultado.innerHTML = "";

      error.innerHTML = "";


      // Quitar puntos de miles

      let gastado =
        Number(
          campo.value.replace(/\./g, "")
        );


      // Validación

      if (
        campo.value === "" ||
        isNaN(gastado) ||
        gastado <= 0
      ) {

        error.innerHTML =
          "Ingresa un valor válido.";

        return;

      }



      // ==========================================
      // DENOMINACIONES
      // ==========================================

      let billetes = [

        2000,
        5000,
        6000,
        8000,
        10000,
        15000,
        20000,
        25000,
        30000,
        40000,
        50000,
        100000

      ];



      // ==========================================
      // BILLETES REALES DE COLOMBIA
      // ==========================================

      let billetesReales = [

        2000,
        5000,
        10000,
        20000,
        50000,
        100000

      ];



      // ==========================================
      // TABLA
      // ==========================================

      let tabla = `

        <table>

          <tr>

            <th>Billete</th>

            <th>Vuelto</th>

          </tr>

      `;



      // ==========================================
      // CALCULAR
      // ==========================================

      for (
        let i = 0;
        i < billetes.length;
        i++
      ) {


        let billete =
          billetes[i];


        let vuelto =
          billete - gastado;


        let esBilleteReal =
          billetesReales.includes(billete);


        let claseBillete =
          esBilleteReal
            ? "billete-real"
            : "";



        if (vuelto < 0) {


          tabla += `

            <tr>

              <td class="${claseBillete}">

                $${billete.toLocaleString("es-CO")}

              </td>


              <td class="no-alcanza">

                No alcanza

              </td>

            </tr>

          `;


        } else {


          tabla += `

            <tr>

              <td class="${claseBillete}">

                $${billete.toLocaleString("es-CO")}

              </td>


              <td class="vuelto">

                $${vuelto.toLocaleString("es-CO")}

              </td>

            </tr>

          `;

        }

      }



      tabla += `

        </table>

      `;


      resultado.innerHTML =
        tabla;

    }



    // ==========================================
    // LIMPIAR
    // ==========================================

    function limpiar() {

      document
        .getElementById("gastado")
        .value = "";


      document
        .getElementById("resultado")
        .innerHTML = "";


      document
        .getElementById("error")
        .innerHTML = "";

    }



    // ==========================================
    // SERVICE WORKER
    // ==========================================

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "./service-worker.js"
          );

        }
      );

    }

  </script>


</body>

</html>
